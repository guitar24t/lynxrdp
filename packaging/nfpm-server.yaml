# nfpm configuration for the LynxRDP server package (.deb and .rpm).
# Built by packaging/package-server.sh, which sets VERSION and ARCH.
name: lynxrdp-server
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
# Empty for a final release; "rc.26" for v0.1.0-rc.26, rendered as
# 0.1.0~rc.26-1. See package-server.sh for why.
prerelease: "${PRERELEASE}"
release: "1"
section: x11
priority: optional
maintainer: LynxRDP contributors <lynxrdp@users.noreply.github.com>
description: |
  Secure loopback-only remote desktop server.
  LynxRDP serves a separate X11 desktop session per user. Clients reach it
  exclusively through an SSH port forward; the daemon identifies the local
  user behind each connection and never accepts passwords itself.
vendor: LynxRDP
homepage: https://github.com/guitar24t/lynxrdp
license: MIT

contents:
  - src: target/release/lynxrdpd
    dst: /usr/bin/lynxrdpd
    file_info:
      mode: 0755
  - src: target/release/lynxrdp-session
    dst: /usr/bin/lynxrdp-session
    file_info:
      mode: 0755
  - src: packaging/lynxrdpd.service
    dst: /usr/lib/systemd/system/lynxrdpd.service
    file_info:
      mode: 0644
  - src: packaging/lynxrdp.toml
    dst: /etc/lynxrdp/lynxrdp.toml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/startwm.sh
    dst: /etc/lynxrdp/startwm.sh
    type: config|noreplace
    file_info:
      mode: 0755
  - src: packaging/pam/lynxrdp.debian
    dst: /usr/share/lynxrdp/pam/lynxrdp.debian
    file_info:
      mode: 0644
  - src: packaging/pam/lynxrdp.rhel
    dst: /usr/share/lynxrdp/pam/lynxrdp.rhel
    file_info:
      mode: 0644
  # Package-owned so removal also removes the policy. Polkit reloads rules
  # automatically; without polkit the file is inert, including on minimal
  # servers that install their desktop environment later.
  - src: packaging/polkit/02-lynxrdp-colord.rules
    dst: /usr/share/polkit-1/rules.d/02-lynxrdp-colord.rules
    file_info:
      mode: 0644
  - src: packaging/lynxrdpd.tmpfiles
    dst: /usr/lib/tmpfiles.d/lynxrdpd.conf
    file_info:
      mode: 0644
  # Marked config|noreplace like the other two: the size and generation count
  # are a policy an admin is expected to tune, and an upgrade must not quietly
  # reset it. logrotate ignores snippets that are group- or world-writable, so
  # the mode is load-bearing rather than habit.
  - src: packaging/lynxrdp.logrotate
    dst: /etc/logrotate.d/lynxrdp
    type: config|noreplace
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/lynxrdp-server/README.md
    file_info:
      mode: 0644
  # The repository the release workflow publishes, so that from the first
  # install on the package manager can update the server itself. Each
  # format gets its own definition and the public signing key in the form
  # its tools read. The definitions are configuration so an administrator's
  # edit (a mirror, a disabled entry) survives an upgrade.
  - src: packaging/repo/lynxrdp.sources
    dst: /etc/apt/sources.list.d/lynxrdp.sources
    type: config
    packager: deb
    file_info:
      mode: 0644
  - src: target/packaging/lynxrdp-archive-keyring.gpg
    dst: /usr/share/keyrings/lynxrdp-archive-keyring.gpg
    packager: deb
    file_info:
      mode: 0644
  - src: packaging/repo/lynxrdp.repo
    dst: /etc/yum.repos.d/lynxrdp.repo
    type: config|noreplace
    packager: rpm
    file_info:
      mode: 0644
  - src: packaging/keys/lynxrdp-packages.asc
    dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-lynxrdp
    packager: rpm
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

overrides:
  deb:
    depends:
      - xvfb
      - fuse3
      - libpam0g
      - libc6
    recommends:
      # Not a hard dependency: without logrotate the server still works, it
      # just grows session logs forever. Making it a dependency would drag
      # cron/systemd-timer machinery onto minimal images for a hygiene job.
      - logrotate
      - dbus-x11
      - xterm
      - x11-xserver-utils
    suggests:
      - xfce4-session
      - xfce4
  rpm:
    depends:
      - xorg-x11-server-Xvfb
      - fuse3
      - pam
    recommends:
      # Same reasoning as the deb: a weak dependency, because a missing
      # logrotate degrades disk hygiene rather than breaking the server.
      - logrotate
      - dbus-x11
      - xterm
      - xorg-x11-server-utils

rpm:
  group: User Interface/X
  summary: Secure loopback-only remote desktop server
  compression: xz
deb:
  compression: xz
