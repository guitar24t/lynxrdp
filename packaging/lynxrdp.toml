# LynxRDP server configuration.
#
# Every key is optional; the values shown are the defaults. Run
# `lynxrdpd --dump-config` to print the effective configuration.

[listen]
# Only loopback addresses are accepted: clients connect through an SSH
# port forward that terminates on this host.
address = "127.0.0.1"
port = 3390
# Optionally also listen on a Unix socket (forward with
# `ssh -L 3390:/run/lynxrdp/lynxrdp.sock host`). Peers are identified with
# SO_PEERCRED.
#unix_socket = "/run/lynxrdp/lynxrdp.sock"

[access]
# Accounts below this uid (system accounts, root) are refused.
min_uid = 1000
# If non-empty, only these users may connect.
allow_users = []
# If non-empty, only members of these groups may connect.
allow_groups = []
# Always refused.
deny_users = ["root"]

[session]
# Screen size used when the client does not request one.
default_width = 1920
default_height = 1080
# Largest size a client may request; also the X server's virtual screen.
max_width = 4096
max_height = 2160
# Headless X server and extra arguments.
xserver = "Xvfb"
xserver_args = []
# Script that starts the desktop environment inside the session.
startwm = "/etc/lynxrdp/startwm.sh"
# Frame rate cap and number of unacknowledged frames allowed in flight
# (1 = lowest latency, 2 = smoother on jittery links).
max_fps = 60
max_in_flight = 2
# Let a session raise that number by itself, up to 8, when the round trip it
# measures justifies more. A fixed 2 frames per round trip is 40 fps at 50 ms
# and 20 fps at 100 ms, and the transport here is an SSH tunnel that is often
# crossing a WAN. The value above stays the floor either way: the session will
# never allow itself fewer frames than you asked for, so set this to false if
# you are tuning for latency and want max_in_flight taken literally.
max_in_flight_auto = true
# Seconds a session may stay without a client before it is ended (0 = never).
idle_timeout_secs = 0
# PAM service used to open the login session (/etc/pam.d/lynxrdp).
pam_service = "lynxrdp"
runtime_dir = "/run/lynxrdp"
session_binary = "/usr/bin/lynxrdp-session"
# Per-user session logs go to <log_dir>/<user>.log.
#log_dir = "/var/log/lynxrdp"
# Physical size the X screen reports, in dots per inch (48 to 480). This is
# what xdpyinfo prints and what Qt scales itself by. GTK does not read it --
# GTK follows the Xft.dpi X resource, which your desktop's own settings set --
# so a GTK application will not follow this on its own.
dpi = 96

[reporting]
# Heartbeats to a monitoring server, so an operator can see which machines
# are up and what address to reach them on. Off by default.
#
# This is the only part of LynxRDP that talks to the network by itself. It
# only ever sends: no port is opened here and nothing is read back, so the
# loopback-only rule above still holds.
#
# Reports are sealed so a packet capture cannot read your hostnames, but the
# key is compiled into the software and is therefore not secret from anyone
# holding it. That is obfuscation, not confidentiality -- read SECURITY.md
# before pointing this across an untrusted network.
#
# tools/lynxrdp-monitor in the source tree is a viewer for these reports.
enabled = false
# Where to send them. IPv6 needs brackets: "[2001:db8::5]:9999".
#destination = "monitor.example.org:9999"
# Seconds between reports (5 to 86400).
interval_secs = 60
# Reported instead of the system hostname, if you name hosts differently.
#node_name = "desk01"
