# nfpm configuration for the Linux client package (.deb and .rpm).
name: lynxrdp-client
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
release: "1"
section: x11
priority: optional
maintainer: LynxRDP contributors <lynxrdp@users.noreply.github.com>
description: |
  LynxRDP remote desktop client.
  Connects to a LynxRDP server through an SSH port forward.
vendor: LynxRDP
homepage: https://github.com/guitar24t/lynxrdp
license: MIT
contents:
  - src: target/release/lynxrdp
    dst: /usr/bin/lynxrdp
    file_info:
      mode: 0755
  # Desktop integration: the entry puts LynxRDP in the applications menu, and
  # the icons let the menu, the dock and the window manager draw it. The theme
  # is only rescanned when the cache is touched, which postinstall does.
  - src: packaging/lynxrdp.desktop
    dst: /usr/share/applications/lynxrdp.desktop
  - src: assets/icons/hicolor/16x16/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/16x16/apps/lynxrdp.png
  - src: assets/icons/hicolor/22x22/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/22x22/apps/lynxrdp.png
  - src: assets/icons/hicolor/24x24/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/24x24/apps/lynxrdp.png
  - src: assets/icons/hicolor/32x32/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/32x32/apps/lynxrdp.png
  - src: assets/icons/hicolor/48x48/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/48x48/apps/lynxrdp.png
  - src: assets/icons/hicolor/64x64/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/64x64/apps/lynxrdp.png
  - src: assets/icons/hicolor/128x128/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/128x128/apps/lynxrdp.png
  - src: assets/icons/hicolor/256x256/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/256x256/apps/lynxrdp.png
  - src: assets/icons/hicolor/512x512/apps/lynxrdp.png
    dst: /usr/share/icons/hicolor/512x512/apps/lynxrdp.png
  - src: assets/icons/hicolor/scalable/apps/lynxrdp.svg
    dst: /usr/share/icons/hicolor/scalable/apps/lynxrdp.svg
scripts:
  postinstall: packaging/scripts/client-postinstall.sh
  postremove: packaging/scripts/client-postremove.sh
overrides:
  deb:
    depends:
      - openssh-client
      - libxkbcommon-x11-0
      - libxkbcommon0
  rpm:
    depends:
      - openssh-clients
      - libxkbcommon-x11
      - libxkbcommon
