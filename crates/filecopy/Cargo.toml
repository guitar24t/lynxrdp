[package]
name = "lynxrdp-filecopy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lynxrdp-proto = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
tempfile = "3"
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", default-features = false }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
windows-core = "0.58"
