[package]
name = "lynxrdp-filecopy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lynxrdp-proto = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
tempfile = "3"
log = { workspace = true }

# The WebDAV mount password (dav.rs) must come from the OS generator, not
# from tempfile's fastrand. 0.3 is the newest getrandom that still builds on
# rust-version 1.80; 0.4 needs 1.85.
[target.'cfg(target_os = "macos")'.dependencies]
getrandom = "0.3"

# dav.rs and its tests compile under `cfg(test)` on every platform.
[dev-dependencies]
getrandom = "0.3"

# kill(pid, 0) is how the stale-staging sweep asks whether a process exists.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
windows-core = "0.58"
