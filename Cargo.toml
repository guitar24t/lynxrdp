[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/guitar24t/lynxrdp"
authors = ["LynxRDP contributors"]

[workspace.dependencies]
lynxrdp-proto = { path = "crates/proto" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
zstd = "0.13"
proptest = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
# Obfuscation of monitoring reports. Pure Rust, so the "no C libraries"
# property of the build is preserved.
chacha20poly1305 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
strip = false
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
