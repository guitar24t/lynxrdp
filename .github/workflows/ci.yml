name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref so a new push does not leave stale
# in-flight jobs (and stale failures) behind.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Test (Linux, Xvfb end-to-end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install X test dependencies
        # openssh-server is for tunnel_e2e, which starts a throwaway sshd and
        # is the only test that exercises the transport the product ships over.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xterm xfonts-base xdotool xclip python3-gi gir1.2-gtk-3.0 xdg-user-dirs fuse3 x11-utils x11-xserver-utils libxkbcommon-x11-0 libxkbcommon0 openssh-server openssh-client
      - name: Desktop session selection
        run: python3 tools/check-startwm.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # Set here too, and not only on the end-to-end steps below, because one
      # ordinary unit test has an external dependency: x11/empty_drop.rs runs a
      # python3 fixture for the empty-view contract. Its guard skips where
      # python3 is absent, which is right on a developer's machine and wrong
      # here -- python3 arrives with the apt line above, so an absence is a
      # broken workflow and has to fail rather than quietly cover nothing.
      - name: Unit tests
        env:
          LYNXRDP_REQUIRE_E2E: "1"
        run: cargo test --workspace --lib --bins
      # LYNXRDP_REQUIRE_E2E turns every "dependency missing, skipping" guard
      # into a failure. Without it a skipped test is reported as a pass, so
      # losing xvfb from the apt line above would leave these steps green while
      # covering nothing at all. It is set here and nowhere else: a developer
      # without Xvfb still gets skips rather than failures.
      - name: End-to-end tests (session)
        env:
          LYNXRDP_REQUIRE_E2E: "1"
        run: cargo test -p lynxrdp-server --test e2e -- --test-threads=2
      - name: End-to-end tests (daemon)
        env:
          LYNXRDP_REQUIRE_E2E: "1"
        run: cargo test -p lynxrdp-server --test daemon -- --test-threads=1
      - name: End-to-end tests (SSH tunnel)
        env:
          LYNXRDP_REQUIRE_E2E: "1"
        run: cargo test -p lynxrdp-server --test tunnel_e2e -- --test-threads=1
      # Needs no display, socket or root. It is the Rust half of the
      # monitoring payload pin (the Python half is test_report_fixture.py in
      # the monitor job), and an integration test only runs when named: with
      # this step missing, a change to Report::to_json merged green and the
      # fixture guarded nothing.
      - name: Monitoring report fixture
        run: cargo test -p lynxrdp-server --test report_fixture
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Graphical session input (Xvfb)
        run: python3 tools/check-session-ui.py
      - name: X server authorization and lifecycle (Xvfb)
        # Hosted runners need not have opened a logind session. Supply its
        # private runtime location so the real default-path test cannot skip.
        run: |
          lynxrdp_test_runtime="/run/user/$(id -u)"
          if [ ! -e "$lynxrdp_test_runtime" ]; then
            sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$lynxrdp_test_runtime"
          fi
          cargo test -p lynxrdp-server --lib session::xserver::tests:: -- --include-ignored --test-threads=1
      - name: Native file clipboard (Xvfb)
        run: xvfb-run -a cargo test -p lynxrdp-client --lib x11_file_copy -- --ignored --test-threads=1
      - name: Shared application window lifecycle (Xvfb)
        run: xvfb-run -a cargo test -p lynxrdp-client --lib shared_host_closes -- --ignored --test-threads=1

  build-client:
    name: Client (${{ matrix.name }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: lynxrdp
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: lynxrdp
          # Apple Silicon only. Intel Macs are end of life and the macos-13
          # runner pool no longer schedules reliably; the source still builds
          # for x86_64-apple-darwin if anyone needs it.
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: lynxrdp
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: lynxrdp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test protocol and client crates
        run: cargo test -p lynxrdp-proto -p lynxrdp-client -p lynxrdp-filecopy --target ${{ matrix.target }}
      - name: Build release client
        run: cargo build --release -p lynxrdp-client --target ${{ matrix.target }}
      # The Linux legs stop here. They exist to run the tests and a release
      # build with the runner's toolchain; the archive that ships for Linux is
      # made by package-server below, from the binary built against the RHEL 9
      # glibc, because one linked here needs the runner's glibc 2.39 and the
      # updater never checks glibc before installing an archive.
      - name: Package
        if: ${{ !startsWith(matrix.name, 'linux-') }}
        shell: bash
        run: packaging/package-client.sh "${{ matrix.target }}" "${{ matrix.name }}" "${{ matrix.bin }}"
      # Built on every run, not only on release, so a broken installer script
      # is caught by the pull request that broke it.
      # NSIS is not part of the runner image, so install it rather than hope.
      # make-setup-exe.sh finds makensis in Program Files without help.
      - name: Install NSIS
        if: startsWith(matrix.name, 'windows-')
        run: choco install nsis --no-progress -y
      - name: Windows installer
        if: startsWith(matrix.name, 'windows-')
        shell: bash
        run: |
          packaging/make-setup-exe.sh \
            "target/${{ matrix.target }}/release/lynxrdp.exe" dist
      - name: macOS disk image
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          packaging/make-app-bundle.sh \
            "target/${{ matrix.target }}/release/lynxrdp" stage
          packaging/make-dmg.sh stage/LynxRDP.app dist "${{ matrix.name }}"
      - name: Verify macOS archive and disk-image bundles
        if: startsWith(matrix.name, 'macos-')
        run: python3 tools/check-macos-packaging.py "target/${{ matrix.target }}/release/lynxrdp"
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(matrix.name, 'linux-') }}
        with:
          name: lynxrdp-client-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  monitor:
    name: Monitor viewer (Python)
    needs: [lint]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/lynxrdp-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --quiet -r requirements.txt pytest
      - name: Qt runtime libraries
        # PySide6 wheels link these but do not ship them.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1
      - name: Tests
        # The GUI tests drive a real window under Qt's offscreen platform, so
        # no display is needed.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  package-server:
    name: Server packages (${{ matrix.name }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-24.04
            arch: amd64
            triple: x86_64-unknown-linux-gnu
          - name: aarch64
            os: ubuntu-24.04-arm
            arch: arm64
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # nfpm is fetched with `go install`; this repository has no Go module
          # of its own, so there is nothing for the default module cache to key
          # on and leaving it enabled only logs a missing go.sum every run.
          cache: false
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      # Built inside AlmaLinux 9 (RHEL 9 ABI, glibc 2.34) rather than on the
      # runner. glibc is backward compatible but not forward: binaries linked
      # against the runner's 2.39 refuse to start on RHEL 9. Building against
      # the oldest glibc we target produces packages that run everywhere we
      # claim support, Ubuntu 24.04 and 26.04 included.
      - name: Build server and client (release, against the RHEL 9 glibc)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e CARGO_TERM_COLOR=always \
            almalinux:9 bash -euo pipefail -c '
              dnf -y install gcc python3 >/dev/null
              # Check the launcher with the RHEL 9 shell and Python too.
              python3 tools/check-startwm.py
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
              . "$HOME/.cargo/env"
              cargo build --release -p lynxrdp-server -p lynxrdp-client
            '
          # The container runs as root, so hand the tree back to the runner.
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Check the packaged binaries can load on RHEL 9
        run: |
          packaging/check-glibc-floor.sh \
            target/release/lynxrdpd \
            target/release/lynxrdp-session \
            target/release/lynxrdp
      - name: Build .deb and .rpm
        run: packaging/package-server.sh "${{ matrix.arch }}"
      # The archive the client's updater downloads for Linux, from the same
      # floor-checked binary as the packages. The build-client Linux legs do
      # not make one: theirs would carry the runner's glibc 2.39, and the
      # updater picks this archive by suffix without looking at glibc, so an
      # archive install on RHEL 9 would update itself into a binary the
      # loader refuses -- the exact failure check-glibc-floor.sh exists to
      # stop. The name has to stay "linux-<arch>": update/mod.rs matches it.
      - name: Linux client archive
        run: packaging/package-client.sh "${{ matrix.triple }}" "linux-${{ matrix.name }}" lynxrdp
      - name: Install the .deb and smoke test
        run: |
          set -x
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/lynxrdp-server_*_${{ matrix.arch }}.deb
          lynxrdpd --version
          lynxrdp-session --version
          lynxrdpd --check
          test -f /etc/pam.d/lynxrdp
          test -x /etc/lynxrdp/startwm.sh
          # The rule must reach the host as a readable package-owned file.
          # It also needs to disappear on removal (checked below), because
          # it controls color management for all non-local sessions. The
          # rules directory itself may be inaccessible to ordinary users.
          sudo cmp packaging/polkit/02-lynxrdp-colord.rules /usr/share/polkit-1/rules.d/02-lynxrdp-colord.rules
          test "$(sudo stat -c '%a:%U:%G' /usr/share/polkit-1/rules.d/02-lynxrdp-colord.rules)" = "644:root:root"
          systemd-analyze verify /usr/lib/systemd/system/lynxrdpd.service
          systemctl is-enabled lynxrdpd
          # Give the freshly-installed unit a moment to reach its running state.
          for i in $(seq 1 10); do
            state="$(systemctl is-active lynxrdpd || true)"
            [ "$state" = "active" ] && break
            sleep 1
          done
          sudo journalctl -u lynxrdpd --no-pager | tail -30 || true
          if [ "$(systemctl is-active lynxrdpd)" != "active" ]; then
            echo "::error::lynxrdpd is not active after install"
            systemctl status lynxrdpd --no-pager || true
            exit 1
          fi
          # The daemon must be listening on loopback only.
          sudo ss -ltnp | grep -E '127\.0\.0\.1:3390' || (echo "::error::not listening on 127.0.0.1:3390"; exit 1)
          # /etc/logrotate.d/lynxrdp is the only thing between one chatty
          # desktop application and a full /var, and a full /var means the
          # daemon cannot open a session log, which means nobody can log in.
          # A broken snippet fails silently in production -- logrotate skips
          # the file and moves on -- so it has to fail here instead.
          test -f /etc/logrotate.d/lynxrdp
          dpkg-query --showformat='${Recommends}\n' -W lynxrdp-server | grep -q logrotate
          # A Recommends, so an install run with --no-install-recommends would
          # not have it; pull it in explicitly rather than let apt's policy
          # decide whether this check runs at all.
          sudo apt-get install -y -q logrotate
          # logrotate's exit status is not a parse verdict: a mistyped
          # directive prints "unknown option ... -- ignoring line" and still
          # exits 0, which is precisely how a broken snippet reaches a
          # production /var unnoticed. Assert on the diagnostics instead.
          if ! sudo logrotate --debug /etc/logrotate.d/lynxrdp >/tmp/lr.log 2>&1 \
              || grep -q 'error:' /tmp/lr.log; then
            cat /tmp/lr.log
            echo "::error::logrotate rejected /etc/logrotate.d/lynxrdp"
            exit 1
          fi
          # Nothing in production names this file: it arrives through
          # "include /etc/logrotate.d", which drops a snippet that is group- or
          # world-writable with an error nobody reads. Only the include path
          # can say the installed mode is one logrotate will still honour.
          sudo logrotate --debug /etc/logrotate.conf 2>&1 \
            | grep -q '/var/log/lynxrdp/\*\.log'
          # Parsing is the easy half. copytruncate is the load-bearing part:
          # the session dup()s its log onto fd 1 and 2 and holds it for its
          # whole life, so a rotation that renamed the file would leave every
          # running desktop appending to an unlinked inode. Hold an fd across
          # a real rotation and prove it still reaches the live path -- that
          # is the invariant, and unlike grepping --debug for the word
          # copytruncate it does not depend on how a given logrotate version
          # words its messages.
          sudo install -d -m 0700 /var/log/lynxrdp
          sudo bash -euo pipefail -c '
            exec 9>>/var/log/lynxrdp/citest.log
            head -c 65536 /dev/zero | tr "\0" x >&9
            logrotate --force /etc/logrotate.d/lynxrdp
            echo still-the-live-file >&9
            grep -q still-the-live-file /var/log/lynxrdp/citest.log
            test -f /var/log/lynxrdp/citest.log.1.gz
            rm -f /var/log/lynxrdp/citest.log /var/log/lynxrdp/citest.log.1.gz
          '
          # Upgrade path. apt sees the same version and does nothing, so use
          # dpkg -i, which always unpacks and reconfigures and so runs the new
          # postinst as "configure <old-version>", exactly what an upgrade
          # does. The daemon must come back as a new process on the new file:
          # the old one starts sessions through /proc/self/exe, which reads
          # "(deleted)" once the binary has been replaced. A unit the
          # administrator disabled must stay disabled.
          old_pid="$(systemctl show -p MainPID --value lynxrdpd)"
          sudo dpkg -i ./dist/lynxrdp-server_*_${{ matrix.arch }}.deb
          for i in $(seq 1 10); do
            [ "$(systemctl is-active lynxrdpd || true)" = "active" ] && break
            sleep 1
          done
          new_pid="$(systemctl show -p MainPID --value lynxrdpd)"
          if [ "$new_pid" = 0 ] || [ "$new_pid" = "$old_pid" ]; then
            echo "::error::the upgrade did not restart lynxrdpd (pid $old_pid -> $new_pid)"
            exit 1
          fi
          test "$(sudo readlink "/proc/$new_pid/exe")" = /usr/bin/lynxrdpd
          sudo systemctl disable --now lynxrdpd
          sudo dpkg -i ./dist/lynxrdp-server_*_${{ matrix.arch }}.deb
          test "$(systemctl is-enabled lynxrdpd || true)" = disabled
          test "$(systemctl is-active lynxrdpd || true)" = inactive
          sudo systemctl enable --now lynxrdpd
          # Removal must end what the daemon started. Under KillMode=process
          # anything in the unit's cgroup outlives "systemctl stop" exactly as
          # a desktop session does, so a stand-in process placed there has to
          # be gone once the package is (preremove.sh says how). The runtime
          # directory goes with it; Debian's remove keeps configuration, and
          # purge is the request to forget the PAM file and the logs too.
          cg="$(systemctl show -p ControlGroup --value lynxrdpd)"
          test -n "$cg"
          sudo sh -c "echo \$\$ > /sys/fs/cgroup$cg/cgroup.procs && echo \$\$ > /tmp/leftover.pid && exec sleep 3600" &
          sleep 1
          leftover="$(cat /tmp/leftover.pid)"
          sudo grep -qx "$leftover" "/sys/fs/cgroup$cg/cgroup.procs"
          sudo apt-get remove -y -q lynxrdp-server
          sudo test ! -e /usr/share/polkit-1/rules.d/02-lynxrdp-colord.rules
          if sudo kill -0 "$leftover" 2>/dev/null; then
            echo "::error::a process the daemon left behind survived package removal"
            exit 1
          fi
          sudo test ! -e /run/lynxrdp
          test -f /etc/pam.d/lynxrdp
          sudo apt-get purge -y -q lynxrdp-server
          sudo test ! -e /etc/pam.d/lynxrdp
          sudo test ! -e /var/log/lynxrdp
      - name: Inspect the .rpm
        run: |
          sudo apt-get install -y -q rpm
          rpm -qpi dist/lynxrdp-server-*.rpm
          rpm -qpl dist/lynxrdp-server-*.rpm
          rpm -qp --scripts dist/lynxrdp-server-*.rpm | head -40
          # nfpm writes deb and rpm from one config but not by one code path;
          # the deb smoke test above cannot speak for the rpm, so check that
          # the snippet and its weak dependency actually made it in.
          rpm -qpl dist/lynxrdp-server-*.rpm | grep -qx /etc/logrotate.d/lynxrdp
          rpm -qpl dist/lynxrdp-server-*.rpm | grep -qx /usr/share/polkit-1/rules.d/02-lynxrdp-colord.rules
          rpm -qp --recommends dist/lynxrdp-server-*.rpm | grep -q logrotate
      - uses: actions/upload-artifact@v7
        with:
          name: lynxrdp-server-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
