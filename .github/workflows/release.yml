name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be cut without pushing a tag, which matters where tag
  # pushes are not available. The tag is created by the release step.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for this release, e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Stamped into the client so it knows which release it is. The Cargo
  # version cannot answer that -- it stays 0.1.0 across every candidate --
  # and without it the updater would compare v0.1.0-rc.6 against "0.1.0" and
  # call the newer release a downgrade. Empty everywhere else, which is how a
  # build that is not a release refuses to replace itself.
  LYNXRDP_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The oldest release whose packages the repository serves. Everything
  # before it shipped packages versioned 0.1.0-1, which apt and dnf rank
  # above every 0.1.0~rc.N-1; serving those would "upgrade" a server back to
  # an old build. Never lower it.
  REPO_FIRST_TAG: v0.1.0-rc.26

jobs:
  build-client:
    name: Client (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # No Linux here on purpose. The Linux archive is made by
          # package-server below, from the binary built against the RHEL 9
          # glibc, so that it passes the same floor check as the packages.
          # Built on this runner it would need glibc 2.39, and the updater
          # picks the archive by suffix without ever comparing glibc, so an
          # archive install on RHEL 9 would update itself into a binary the
          # loader refuses to start.
          # Apple Silicon only; see the note in ci.yml.
          - { name: macos-aarch64,  os: macos-latest,     target: aarch64-apple-darwin,      bin: lynxrdp }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc,    bin: lynxrdp.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p lynxrdp-client --target ${{ matrix.target }}
      - shell: bash
        run: packaging/package-client.sh "${{ matrix.target }}" "${{ matrix.name }}" "${{ matrix.bin }}"
      # NSIS is not part of the runner image, so install it rather than hope.
      # make-setup-exe.sh finds makensis in Program Files without help.
      - name: Install NSIS
        if: startsWith(matrix.name, 'windows-')
        run: choco install nsis --no-progress -y
      - name: Windows installer
        if: startsWith(matrix.name, 'windows-')
        shell: bash
        run: |
          packaging/make-setup-exe.sh \
            "target/${{ matrix.target }}/release/lynxrdp.exe" dist
      - name: macOS disk image
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          packaging/make-app-bundle.sh \
            "target/${{ matrix.target }}/release/lynxrdp" stage
          packaging/make-dmg.sh stage/LynxRDP.app dist "${{ matrix.name }}"
      - name: Verify macOS archive and disk-image bundles
        if: startsWith(matrix.name, 'macos-')
        run: python3 tools/check-macos-packaging.py "target/${{ matrix.target }}/release/lynxrdp"
      - uses: actions/upload-artifact@v7
        with:
          name: lynxrdp-client-${{ matrix.name }}
          path: dist/*

  package-server:
    name: Server packages (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64,  os: ubuntu-24.04,     arch: amd64, triple: x86_64-unknown-linux-gnu }
          - { name: aarch64, os: ubuntu-24.04-arm, arch: arm64, triple: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          # No Go module in this repository; see the note in ci.yml.
          cache: false
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      # Built against the RHEL 9 glibc; see the note in ci.yml.
      - name: Build server and client (release, against the RHEL 9 glibc)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e CARGO_TERM_COLOR=always \
            -e "LYNXRDP_RELEASE_TAG=$LYNXRDP_RELEASE_TAG" \
            almalinux:9 bash -euo pipefail -c '
              dnf -y install gcc >/dev/null
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
              . "$HOME/.cargo/env"
              cargo build --release -p lynxrdp-server -p lynxrdp-client
            '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Check the packaged binaries can load on RHEL 9
        run: |
          packaging/check-glibc-floor.sh \
            target/release/lynxrdpd \
            target/release/lynxrdp-session \
            target/release/lynxrdp
      - run: packaging/package-server.sh "${{ matrix.arch }}"
      # The updater's Linux asset, from the same floor-checked binary as the
      # packages; see the note on build-client above. "linux-<arch>" is the
      # name update/mod.rs matches, so it is fixed here rather than taken from
      # a matrix that no longer has a Linux row.
      - name: Linux client archive
        run: packaging/package-client.sh "${{ matrix.triple }}" "linux-${{ matrix.name }}" lynxrdp
      - uses: actions/upload-artifact@v7
        with:
          name: lynxrdp-server-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish GitHub release
    needs: [build-client, package-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Semver: a hyphen in the tag means a prerelease, so v0.1.0-rc.1 is
          # marked as one and v0.1.0 is not. The packages carry the same
          # distinction as a tilde (0.1.0~rc.1-1), which is how dpkg and rpm
          # spell "before 0.1.0"; package-server.sh derives it from the tag.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  # The APT and RPM repositories on GitHub Pages, rebuilt whole from the
  # release assets of the newest releases each time, so they have no state
  # of their own to drift. A server package installs the definitions and
  # the public key, which is what lets apt and dnf update the server after
  # the first install. The key is the LYNXRDP_PACKAGE_SIGNING_KEY secret;
  # build-repo.sh checks it against the committed public key.
  publish-repo:
    name: Publish package repositories
    needs: release
    runs-on: ubuntu-24.04
    # Pages deployments authenticate with an OIDC token rather than the
    # contents scope the other jobs use.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Repository tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev apt-utils createrepo-c rpm gnupg
      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.LYNXRDP_PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::the LYNXRDP_PACKAGE_SIGNING_KEY secret is not set; see AGENTS.md"
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
      - name: Collect the packages the repository serves
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: packaging/collect-repo-packages.sh packages "$REPO_FIRST_TAG" 5
      - name: Build the repositories
        run: |
          key="$(gpg --batch --show-keys --with-colons packaging/keys/lynxrdp-packages.asc \
            | awk -F: '/^fpr/ { print $10; exit }')"
          packaging/build-repo.sh packages site --key "$key"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
